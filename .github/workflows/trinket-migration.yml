name: Snapshot Trinkets and migrate to Basthon

on:
  push:
    branches:
      - agent/migrate-trinkets-to-basthon

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-trinkets-to-basthon

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect legacy block Trinkets
        run: |
          python - <<'PY'
          import json, re, urllib.request
          for trinket_id in ('045908554a', '0a3095c9fa'):
              url = f'https://trinket.io/embed/blocks/{trinket_id}'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              text = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', errors='replace')
              match = re.search(r'trinketObject\s*=\s*(\{.*?\});\s*(?:\r?\n\s*)*draftObject', text, re.S)
              print('\nTRINKET', trinket_id)
              if not match:
                  print('NO OBJECT')
                  continue
              obj = json.loads(match.group(1))
              print('lang=', obj.get('lang'), 'name=', obj.get('name'))
              print('code=', obj.get('code'))
              print('assets=', obj.get('assets'))
          PY

      - name: Snapshot Trinkets and update live pages
        run: python scripts/migrate_trinkets_to_basthon.py

      - name: Validate migrated source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('scripts/trinket_migration_report.json').read_text(encoding='utf-8'))
          assert report['trinket_references_replaced'] > 0
          root = Path('docs/_static/basthon_examples')
          for item in report['trinkets'].values():
              main = root / f"trinket_{item['id']}" / item['main']
              assert main.is_file(), main
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/trinket_migration_report.json
          if git diff --cached --quiet; then
            echo "No migration changes"
          else
            git commit -m "Snapshot Trinkets and migrate to Basthon [skip ci]"
            git push origin HEAD:agent/migrate-trinkets-to-basthon
          fi
